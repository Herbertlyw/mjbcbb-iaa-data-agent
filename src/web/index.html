<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>本地数据分析</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#question">跳到问题输入</a>
    <header class="app-header">
      <div class="brand">
        <span id="brand-mark" class="brand-mark" aria-hidden="true">DA</span>
        <div>
          <h1 id="scenario-title">Data Agent</h1>
          <p id="banner">正在连接本地服务…</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="database-label" class="environment">本地合成数据</span>
        <button
          id="history-toggle"
          class="secondary mobile-toggle"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          会话历史
        </button>
        <button id="new-session" class="secondary" disabled>新建会话</button>
      </div>
    </header>
    <div class="app-layout">
      <aside id="sidebar" aria-label="会话导航">
        <div class="sidebar-heading">会话历史</div>
        <nav id="sessions" class="sessions" aria-label="所有会话"><p class="empty">正在读取会话…</p></nav>
        <div id="sessions-state" class="history-state" role="status" aria-live="polite"></div>
        <div class="history-actions">
          <button id="sessions-retry" class="secondary" hidden>重试会话列表</button>
          <button id="sessions-more" class="secondary" hidden>加载更多会话</button>
        </div>
        <div class="sidebar-heading">当前会话的问题</div>
        <nav id="history" class="sessions" aria-label="问题历史">
          <p class="empty">这个会话还没有问题。</p>
        </nav>
        <div id="history-state" class="history-state" role="status" aria-live="polite"></div>
        <div class="history-actions">
          <button id="history-retry" class="secondary" hidden>重试问题历史</button>
          <button id="history-more" class="secondary" hidden>加载更多问题</button>
          <button id="active-job" class="secondary" hidden>查看进行中的任务</button>
        </div>
        <div class="sidebar-footer">数据均为合成内容<br />查询以只读方式执行</div>
      </aside>
      <main id="main-content">
        <div class="workspace">
          <div id="connection-notice" class="notice" role="alert" hidden></div>
          <button id="visitor-reset" type="button" hidden>重新开始访客会话（无法访问旧身份历史）</button>
          <div id="pending-submission" class="notice" role="status" hidden>
            上次提问结果待确认；它可能已经提交。请核对/继续同一次提交，或明确开始新的分析。
            <button id="pending-resume" type="button">核对／继续上次提交</button>
            <button id="pending-new" type="button">开始新的分析</button>
          </div>
          <button id="detail-retry" class="secondary" hidden>重试读取任务</button>
          <div class="workspace-heading">
            <h2>分析工作台</h2>
            <p id="workspace-intro">从一个问题开始，沿数据来源查看结果。</p>
          </div>
          <section id="release-context" class="release-context" aria-label="合成数据范围" hidden>
            <strong>当前合成数据</strong>
            <p id="release-description"></p>
            <code id="release-version"></code>
          </section>
          <article id="result" aria-label="分析结果" aria-busy="false"></article>
          <form id="composer" class="composer">
            <label for="question">你的问题</label>
            <textarea
              id="question"
              rows="3"
              placeholder="描述你想了解的指标、范围和时间…"
              aria-describedby="input-hint"
              disabled
            ></textarea>
            <div class="composer-toolbar">
              <span id="input-hint" class="muted">Ctrl / ⌘ + Enter 发送</span>
              <div class="composer-actions">
                <span id="status" class="status queued" role="status" hidden></span>
                <button id="cancel" type="button" class="secondary" hidden>取消任务</button>
                <button id="ask" type="submit" disabled>发送问题 <span aria-hidden="true">↑</span></button>
              </div>
            </div>
          </form>
          <div class="workspace-options">
            <div class="model-controls">
              <label for="model">模型</label
              ><select id="model" disabled>
                <option>等待连接</option>
              </select>
              <label for="reasoning">思考档位</label
              ><select id="reasoning" disabled>
                <option>—</option>
              </select>
            </div>
            <details class="mode-info">
              <summary>当前运行模式</summary>
              <p id="mode-description">正在读取服务配置…</p>
            </details>
          </div>
          <section class="examples" aria-labelledby="examples-heading">
            <div class="examples-heading"><h3 id="examples-heading">从业务场景开始</h3><span id="example-count"></span></div>
            <p>选择问题，先查看范围与口径，再填入输入框。</p>
            <div id="example-categories" class="example-categories" role="group" aria-label="业务场景分类"></div>
            <div id="prompts"></div>
            <div id="example-detail" class="example-detail" hidden>
              <p id="example-scope" class="example-scope"></p>
              <p id="example-question"></p>
              <p id="example-note" class="example-note"></p>
              <button id="use-example" type="button" class="secondary">填入这个问题</button>
            </div>
          </section>
          <details id="events-panel" class="events-panel">
            <summary>工具与事件 <span id="event-count" class="count">0</span></summary>
            <div id="log" class="log"></div>
          </details>
          <p id="stream-status" class="stream-status" role="status"></p>
          <noscript><p class="notice">请启用 JavaScript，然后通过本地服务打开本页面。</p></noscript>
        </div>
      </main>
    </div>
  </body>
</html>
